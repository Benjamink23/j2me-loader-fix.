
name: Build J2ME Loader DexFix APK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-apk.yml
      - J2ME_Loader_1.8.2_R381_Dexing_Fix_Source.zip

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Read repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK and NDK
        shell: bash
        run: |
          # NDK r22 tools still need legacy ncurses libraries.
          sudo apt-get update -qq
          sudo apt-get install -y libtinfo5 libncurses5
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;22.1.7171670'

      - name: Unpack patched Loader 1.8.2 source
        shell: bash
        run: |
          test -s J2ME_Loader_1.8.2_R381_Dexing_Fix_Source.zip
          mkdir -p loader-project
          unzip -q J2ME_Loader_1.8.2_R381_Dexing_Fix_Source.zip -d loader-project
          test -f loader-project/nikita36078-J2ME-Loader-7e978c5/gradlew

      - name: Build signed debug APK
        working-directory: loader-project/nikita36078-J2ME-Loader-7e978c5
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleOpenDebug

      - name: Provide downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: J2ME_Loader_1.8.2_DexFix_APK
          path: loader-project/nikita36078-J2ME-Loader-7e978c5/app/build/outputs/apk/open/debug/*.apk
          if-no-files-found: error
          retention-days: 14



